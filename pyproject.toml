[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glucosa"
version = "0.1.0"
description = "Análisis de solo lectura de los datos de SeguimientoGlucosa sincronizados en Firestore."
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "plotly",
    "pandas",
    "requests",
    "keyring",
    "cryptography",
    "platformdirs",
    "tzdata",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/glucosa/audit/report.py" = ["E501"]  # líneas de texto del informe
"src/glucosa/ui/glucose_page.py" = ["E501"]  # textos largos de la interfaz
"src/glucosa/ui/glucose_style.py" = ["E501"]  # CSS en una constante
"tests/**" = ["E501"]
