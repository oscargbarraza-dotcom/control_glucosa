name: seguimiento_glucosa
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0

  # Persistencia local del historial completo de mediciones (SQLite).
  sqflite: ^2.4.4+2
  path: ^1.9.1

  # Formateo de fechas en la pantalla de Historial.
  intl: ^0.20.3

  # Gráfico de evolución de glucosa en la pestaña "Gráfico" del Historial.
  fl_chart: ^1.2.0

  # Base para la integración con Firebase (proyecto "seguimiento-glucosa").
  # El almacenamiento principal de datos de salud sigue siendo SQLite local;
  # Firebase se añade como cimiento para pasos futuros del roadmap
  # (autenticación, sincronización entre dispositivos).
  firebase_core: ^5.0.0

  # Autenticación de usuarios (roadmap punto 13): inicio de sesión opcional
  # con correo/contraseña y con Google. No reemplaza SQLite ni es
  # obligatorio para usar la app.
  firebase_auth: ^7.0.0
  google_sign_in: ^7.2.0

  # Respaldo/restauración manual en la nube (roadmap punto 14), disponible
  # solo con sesión iniciada. SQLite sigue siendo el almacenamiento
  # principal; Firestore solo guarda una copia de respaldo por usuario.
  cloud_firestore: ^7.0.0

  # Importación manual de glucosa desde sensores/CGM (roadmap punto 15),
  # vía Google Health Connect (Android) y Apple HealthKit (iOS). Requiere
  # minSdk 26 en Android (ver android/app/build.gradle.kts). SQLite sigue
  # siendo el almacenamiento principal; esta dependencia solo lee datos
  # de salud ya existentes en la plataforma, nunca escribe en ella.
  health: ^13.3.2

  # Notificaciones push locales para los recordatorios de glucosa
  # post-comida (roadmap punto 17, Fase B). `flutter_local_notifications`
  # programa y muestra las notificaciones nativas aunque la app esté en
  # background o cerrada; `timezone`/`flutter_timezone` son necesarias
  # para programar los horarios exactos respetando la zona horaria local
  # del dispositivo.
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Identificador estable (UUID v4) para cada registro de salud (glucosa,
  # comidas, tomas de medicamentos, biometría), independiente del `id`
  # autoincremental de SQLite (roadmap punto 3: base para una futura
  # sincronización/fusión entre dispositivos sin duplicados).
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Implementación FFI de sqflite para pruebas unitarias de
  # SqliteGlucoseRepository, sin depender del plugin nativo (emulador o
  # dispositivo).
  sqflite_common_ffi: ^2.4.4

  # Generan el icono de la app (gota de sangre, símbolo de
  # concienciación sobre diabetes) y el splash screen nativo a partir
  # de los PNG en `assets/icon/` (ver configuración más abajo y
  # `tool/generate_icon_assets.py`). Solo se usan en tiempo de
  # desarrollo (`dart run flutter_launcher_icons` / `dart run
  # flutter_native_splash:create`); no quedan en el binario final.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/icon/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Configuración de `flutter_launcher_icons` (icono de la app en todas las
# plataformas). Los PNG de origen se generan con
# `python tool/generate_icon_assets.py`; luego se aplican con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 26 # Coincide con minSdk real (android/app/build.gradle.kts).
  # El icono base tiene esquinas con canal alfa (el círculo azul no
  # cubre del todo un lienzo cuadrado); la App Store rechaza íconos
  # con transparencia, así que se rellena con el mismo azul del fondo.
  remove_alpha_ios: true
  background_color_ios: "#0D47A1"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0D47A1"
    theme_color: "#0D47A1"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

# Configuración de `flutter_native_splash` (pantalla de bienvenida
# nativa que se muestra mientras Flutter termina de cargar, antes de
# que `SplashScreen` -definida en `lib/screens/splash_screen.dart`-
# tome el control). Se aplica con:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0D47A1"
  image: "assets/icon/icon_foreground.png"
  android_12:
    color: "#0D47A1"
    image: "assets/icon/icon_foreground.png"
